    game:
        already-running: "<red>A game is already running!</red>"
        need-two-players: "<red>Need at least 2 players!</red>"
        no-arenas: "<red>No arenas configured. Use /prophunt arena create <name>.</red>"
        no-cuboids: "<red>No cuboid(s) are set. Use /prophunt arena pos1 <name> and pos2.</red>"
        missing-spawns: "<red>Missing spawn(s). Add both hider and seeker spawns to at least one arena.</red>"
        no-playable-arenas: "<red>No playable arena found (needs cuboid + hider spawns + seeker spawns).</red>"
        round-start: "<gradient:#FDE68A:#F97316>=== PropHunt Started on Arena: {arena} ===</gradient>"
        round-start-block-pool: "<color:#86EFAC>Hiders are assigned random map blocks from this arena.</color>"
        seeker-release-delay: "<color:#FB7185>Seekers: releasing in {seconds} seconds!</color>"
        seekers-list: "<color:#FB7185>Seekers this round: </color><white>{seekers}</white>"
        seekers-released: "<gradient:#F97316:#EF4444>Seekers RELEASED! Find the props!</gradient>"
