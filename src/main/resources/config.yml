# PropHunt Configuration
# Now using MiniMessage format exclusively
# Supports gradients with <gradient:#RRGGBB:#RRGGBB>text</gradient>
# Supports single hex colors with <color:#RRGGBB>
# Text tags: <bold>, <italic>, <underlined>, <strikethrough>, <obfuscated>

gameplay:
    # Ticks a hider must stand still before their block solidifies (20 ticks = 1 second)
    lock-ticks: 60

    # Number of hits a hider can take before being found
    hider-hp: 3

    # Seconds seekers are held back at the start of the game
    seeker-grace-seconds: 30

    # Total game duration in seconds after seekers are released
    game-duration-seconds: 300

    # Remaining-time boss bar shown during the seeking phase.
    # Colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE.
    # Overlays: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20.
    timer-boss-bar:
        enabled: true
        title: "<gold>Time remaining:</gold> <yellow>{time}</yellow>"
        color: YELLOW
        overlay: PROGRESS

    # Hider-only countdown shown while seekers are frozen.
    # Use {time} in the title for the remaining seeker grace time.
    seeker-release-boss-bar:
        enabled: true
        title: "<red>Seekers releasing in:</red> <yellow>{time}</yellow>"
        color: RED
        overlay: PROGRESS

    # Maximum number of blocks sampled from the selected arena cuboid when building
    # the random hider block pool. Higher values are more accurate but heavier.
    arena-scan-max-blocks: 120000

    # Minimum number of occurrences a block type must have in the sampled arena volume
    # to be included in the hider block pool. Increase this to remove rare outliers.
    arena-min-block-occurrences: 8

    # Team sizing: one seeker per this many players, rounded up, minimum 1 seeker.
    players-per-seeker: 3

    # Cooldown applied to seeker hits to avoid duplicate hit events.
    seeker-hit-cooldown-ticks: 4

    # Seconds hiders are combat-tagged after being hit. While tagged,
    # they cannot change their disguise block.
    hider-combat-tag-seconds: 6

    # Namespaced Minecraft sound played to a seeker alongside the HIT confirmation.
    seeker-hit-sound: minecraft:entity.experience_orb.pickup

    # Minimum number of ticks between repeated cannot-solidify messages.
    cannot-solidify-message-cooldown-ticks: 200

    # Extra blindness seconds added to seekers while frozen so the effect does not expire early.
    freeze-blindness-buffer-seconds: 5

    # Show the release countdown title for the last N seconds.
    countdown-title-threshold-seconds: 5

    # Broadcast a time-remaining message when the round reaches these second values.
    round-warning-seconds:
        - 300
        - 60

    # What happens to a hider when they are found.
    # convert - the hider joins the seekers (default)
    # spectate - the hider spectates the rest of the round
    on-hider-death: convert

    # Whether seekers glow red so hiders can see them through walls.
    seeker-glow: true

    # Main deny list used by disguise validation.
    # This includes the blocks that were previously hardcoded in GameManager.
    blocked-disguise-blocks:
        - BEDROCK
        - BARRIER
        - COMMAND_BLOCK
        - CHAIN_COMMAND_BLOCK
        - REPEATING_COMMAND_BLOCK
        - WATER
        - LAVA
        - LIGHT
        - STRUCTURE_VOID
        - WHITE_CARPET
        - ORANGE_CARPET
        - MAGENTA_CARPET
        - LIGHT_BLUE_CARPET
        - YELLOW_CARPET
        - LIME_CARPET
        - PINK_CARPET
        - GRAY_CARPET
        - LIGHT_GRAY_CARPET
        - CYAN_CARPET
        - PURPLE_CARPET
        - BLUE_CARPET
        - BROWN_CARPET
        - GREEN_CARPET
        - RED_CARPET
        - BLACK_CARPET
        - SNOW
        - SNOW_BLOCK

    # Whitelist for non-solid blocks that should still be valid disguises.
    allowed-non-solid-disguise-blocks:
        - SHORT_GRASS
        - FERN
        - TALL_GRASS
        - LARGE_FERN
        - SUNFLOWER
        - LILAC
        - ROSE_BUSH
        - PEONY
        - PITCHER_PLANT
        - WHITE_BED
        - ORANGE_BED
        - MAGENTA_BED
        - LIGHT_BLUE_BED
        - YELLOW_BED
        - LIME_BED
        - PINK_BED
        - GRAY_BED
        - LIGHT_GRAY_BED
        - CYAN_BED
        - PURPLE_BED
        - BLUE_BED
        - BROWN_BED
        - GREEN_BED
        - RED_BED
        - BLACK_BED
        - IRON_DOOR
        - OAK_DOOR
        - SPRUCE_DOOR
        - BIRCH_DOOR
        - JUNGLE_DOOR
        - ACACIA_DOOR
        - DARK_OAK_DOOR
        - MANGROVE_DOOR
        - CHERRY_DOOR
        - PALE_OAK_DOOR
        - BAMBOO_DOOR
        - CRIMSON_DOOR
        - WARPED_DOOR

    # Explicitly allow specific disguise blocks, bypassing built-in restrictions.
    # Use this for special cases that you know are safe for your server.
    # Example values: IRON_DOOR, WHITE_BED, TALL_GRASS
    force-allow-disguise-blocks: []

    # Explicitly deny specific disguise blocks, even if they would normally be allowed.
    # Useful for quickly removing problematic blocks without code changes.
    force-deny-disguise-blocks: []

    # Used when arena sampling finds no valid blocks.
    default-hider-blocks:
        - GRASS_BLOCK
        - DIRT
        - STONE
        - COBBLESTONE
        - OAK_LOG
        - BIRCH_LOG
        - SAND
        - GRAVEL
        - OAK_PLANKS
        - SPRUCE_PLANKS
        - BRICKS
        - MOSSY_COBBLESTONE
        - BOOKSHELF
        - CRAFTING_TABLE
        - CHEST
        - BARREL
        - HAY_BLOCK
        - MELON
        - PUMPKIN
        - TNT
        - CACTUS
        - CLAY
        - SMOOTH_STONE
        - ANDESITE
        - DIORITE
        - GRANITE
        - OAK_LEAVES
        - SNOW_BLOCK
        - ICE
        - FURNACE

display:
    title:
        fade-in-ticks: 10
        stay-ticks: 50
        fade-out-ticks: 10

titles:
    round-start:
        title: "<gradient:#FFD166:#F97316>PropHunt Started</gradient>"
        subtitle: "<color:#FDE68A>Arena: {arena}</color> <dark_gray>| </dark_gray><color:#FB7185>Seekers release in {seconds}s</color>"
    seeker-role:
        title: "<gradient:#FB7185:#EF4444>You are the SEEKER</gradient>"
        subtitle: "<color:#FDE68A>Frozen and blinded until release</color>"
    hider-role:
        title: "<gradient:#34D399:#10B981>You are a HIDER</gradient>"
        subtitle: "<color:#FDE68A>Stand still to solidify before release</color>"
    seekers-waiting:
        title: "<gradient:#F97316:#EF4444>Waiting for hiders to hide...</gradient>"
        subtitle: "<color:#FDE68A>Releasing in {seconds}s</color>"
    release-countdown:
        title: "<gradient:#FB7185:#F43F5E>Release in {seconds}</gradient>"
        subtitle: "<color:#D1D5DB>Get ready</color>"
    seekers-released:
        title: "<gradient:#F97316:#EF4444>Seekers Released</gradient>"
        subtitle: "<color:#FDE68A>Find the props</color>"
    seekers-go:
        title: "<gradient:#F59E0B:#EF4444>GO</gradient>"
        subtitle: "<color:#FDE68A>Find the hiders</color>"
    solidified:
        title: "<gradient:#67E8F9:#38BDF8>SOLIDIFIED</gradient>"
        subtitle: "<color:#FDE68A>You are locked in place</color>"
    unlocked:
        title: "<gradient:#FDE68A:#F59E0B>UNLOCKED</gradient>"
        subtitle: "<gradient:#86EFAC:#22C55E>Keep moving</gradient>"
    found:
        title: "<gradient:#FB7185:#B91C1C>You Were Found</gradient>"
        subtitle: "<color:#D1D5DB>You are now a seeker</color>"
    found-spectate:
        subtitle: "<color:#D1D5DB>You are now spectating</color>"
    hiders-win:
        title: "<gradient:#6EE7B7:#16A34A>HIDERS WIN</gradient>"
        subtitle: "<color:#FDE68A>Round over</color>"
    seekers-win:
        title: "<gradient:#FB7185:#DC2626>SEEKERS WIN</gradient>"
        subtitle: "<color:#FDE68A>Round over</color>"

messages:
    prefix: "<gradient:#FDE68A:#F97316><bold>PropHunt</bold></gradient> <dark_gray>»</dark_gray> "

    errors:
        no-permission: "<red>No permission.</red>"
        players-only: "<red>Players only.</red>"

    command:
        use-prefix: true
        stopped: "<yellow>PropHunt stopped.</yellow>"
        reload-complete: "<green>PropHunt config reloaded.</green>"
        no-active-game: "<red>No active game.</red>"
        not-a-hider: "<red>You are not a hider.</red>"
        changing-disguise: "<yellow>Changing disguise block...</yellow>"
        status-state: "<gold>State: {state}</gold>"
        status-hiders: "<green>Hiders: {count}</green>"
        status-mode: "<aqua>Mode: {mode}</aqua>"
        status-seekers: "<red>Seekers: {count}</red>"
        status-queue: "<yellow>Queue: {count} ({open})</yellow>"
        invalid-gamemode: "<red>Invalid mode. Options: convert, spectate</red>"
        gamemode-set: "<green>On-death mode set to: </green><yellow>{mode}</yellow>"
        player-not-found: "<red>Player not found: {player}</red>"
        force-seeker-pre-game-only: "<red>This command can only be used before the game starts.</red>"
        force-seeker-not-in-queue: "<red>{player} is not in the queue.</red>"
        force-seeker-already: "<yellow>{player} is already marked as a seeker.</yellow>"
        force-seeker-queued: "<green>Marked {player} as a seeker for the next round.</green>"
        force-seeker-target-queued: "<yellow>An admin marked you as a seeker for the next round.</yellow>"
        arena-usage: "<yellow>Usage: /prophunt arena <create|remove|pos1|pos2|addhiderspawn|addseekerspawn|list|info> ...</yellow>"
        arena-create-usage: "<red>Usage: /prophunt arena create <name></red>"
        arena-remove-usage: "<red>Usage: /prophunt arena remove <name></red>"
        arena-info-usage: "<red>Usage: /prophunt arena info <name></red>"
        arena-pos1-usage: "<red>Usage: /prophunt arena pos1 <name></red>"
        arena-pos2-usage: "<red>Usage: /prophunt arena pos2 <name></red>"
        arena-addhiderspawn-usage: "<red>Usage: /prophunt arena addhiderspawn <name></red>"
        arena-addseekerspawn-usage: "<red>Usage: /prophunt arena addseekerspawn <name></red>"
        no-arenas-configured: "<red>No arenas configured.</red>"
        arenas-list: "<gold>Arenas: {arenas}</gold>"
        unknown-arena-subcommand: "<red>Unknown arena subcommand.</red>"
        help-player:
            - "<gradient:#FDE68A:#F97316>=== PropHunt Commands ===</gradient>"
            - "<color:#86EFAC>/prophunt join</color> - Join the next game queue"
            - "<color:#86EFAC>/prophunt leave</color> - Leave the next game queue"
            - "<color:#86EFAC>/prophunt pick</color> - Change your auto-assigned disguise block"

        help-admin:
            - "<gradient:#FDE68A:#F97316>=== PropHunt Commands ===</gradient>"
            - "<color:#FDE68A>/prophunt queue</color> - Open the join queue"
            - "<color:#FDE68A>/prophunt start</color> - Start the game"
            - "<color:#FDE68A>/prophunt stop</color> - Stop the game"
            - "<color:#FDE68A>/prophunt reload</color> - Reload config and live settings"
            - "<color:#86EFAC>/prophunt join</color> - Join the next game queue"
            - "<color:#86EFAC>/prophunt leave</color> - Leave the next game queue"
            - "<color:#86EFAC>/prophunt pick</color> - Change your auto-assigned disguise block"
            - "<color:#93C5FD>/prophunt status</color> - Show game status"
            - "<color:#C4B5FD>/prophunt arena create <name></color> - Create arena"
            - "<color:#C4B5FD>/prophunt arena remove <name></color> - Remove arena"
            - "<color:#C4B5FD>/prophunt arena pos1/pos2 <name></color> - Set arena cuboid"
