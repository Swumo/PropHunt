        set-pos: "<green>Set {pos} for arena {arena}.</green>"
        add-spawn: "<green>Added {type} spawn to arena {arena}.</green>"

    queue:
        opened: "<green>Queue opened. Players can now use /prophunt join.</green>"
        closed-manual: "<yellow>Queue closed.</yellow>"
        player-joined: "<yellow>{player} has joined the queue.</yellow>"
        unavailable: "<red>Could not open the queue right now.</red>"
        closed: "<red>Queue is closed while a game is running.</red>"
        not-open: "<red>Queue is not open. Wait for an admin to use /prophunt queue.</red>"
        joined: "<green>You joined the PropHunt queue.</green>"
        already-joined: "<yellow>You are already in the queue.</yellow>"
        left: "<yellow>You left the PropHunt queue.</yellow>"
        not-in-queue: "<red>You are not in the queue.</red>"

# Legacy top-level gameplay keys are still read as fallbacks for older configs.
# Arena data is now stored in arenas.yml.
