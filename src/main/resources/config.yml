        final-minute-blocks-header: "<color:#F59E0B>One minute left! </color><color:#FDE68A>Remaining hider blocks:</color>"
        final-minute-blocks-line: "<color:#FDE68A>{count}x </color><white>{block}</white>"
        final-minute-blocks-none: "<gray>No hiders are left.</gray>"
        hider-hit: "<red>You were hit! HP: {hp}</red>"
        seeker-hit-confirm: "<yellow>HIT!</yellow>"
        must-hit-disguise-block: "<red>You must hit the disguise block, not the player.</red>"
        found-broadcast: "<red>{hider} was found by {seeker}! {remaining} hiders left.</red>"
        force-stopped: "<red>The game was force stopped by an admin.</red>"
        hiders-win: "<gradient:#6EE7B7:#16A34A>=== HIDERS WIN! ===</gradient>"
        seekers-win: "<gradient:#FB7185:#DC2626>=== SEEKERS WIN! ===</gradient>"
        random-disguise: "<green>Random disguise: {block}</green>"
        unlock-first: "<red>Unlock first by moving!</red>"
        cannot-solidify-block: "<red>You cannot solidify while standing in occupied space.</red>"
        cannot-solidify-floor: "<red>You cannot solidify on this surface.</red>"
        block-change-locked-final-minute: "<red>You cannot change disguise blocks in the final minute.</red>"
        block-change-locked-combat-tag: "<red>You were recently hit. Wait {seconds}s before changing disguise.</red>"
        invalid-disguise: "<red>That block cannot be used as a disguise.</red>"
        disguised-as: "<green>Disguised as {block}!</green>"
        player-quit: "<yellow>{player} </yellow><gray>left the game.</gray>"
        seeker-quit-all-left: "<yellow>{player} </yellow><gray>left — no seekers remain. Hiders win!</gray>"
        hider-quit-all-left: "<yellow>{player} </yellow><gray>left — no hiders remain. Seekers win!</gray>"

    arena:
        already-exists: "<red>Arena already exists: {arena}</red>"
        created: "<green>Created arena: {arena}</green>"
        removed: "<green>Removed arena: {arena}</green>"
        not-found: "<red>Arena not found: {arena}</red>"
        spawn-needs-cuboid: "<red>Set pos1 and pos2 for this arena before adding spawns.</red>"
